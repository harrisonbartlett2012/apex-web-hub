<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX // Cloud Gateway</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content strong { font-weight: 700; color: inherit; }
        .markdown-content em { font-style: italic; }
        .markdown-content code { background-color: rgba(0,0,0,0.2); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.9em; }
        .markdown-content pre { background-color: rgba(0,0,0,0.3); padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; }
        .markdown-content pre code { background-color: transparent; padding: 0; font-size: 0.85em; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; }
        .markdown-content h1 { font-size: 1.5em; }
        .markdown-content h2 { font-size: 1.25em; }
        .markdown-content h3 { font-size: 1.1em; }
    </style>
</head>
<body class="bg-base-300 h-[100dvh] flex flex-col p-4 md:p-8 font-mono relative overflow-hidden transition-colors duration-300">

    <!-- MAIN CHAT INTERFACE -->
    <header class="flex justify-between items-center border-b border-primary/30 pb-4 mb-4">
        <div class="flex items-center gap-2">
            <span class="loading loading-ring loading-md text-primary"></span>
            <h1 class="text-2xl font-bold tracking-widest text-primary">APEX // WEB_HUB</h1>
        </div>
        <div class="flex items-center gap-2">
            <div id="status-badge" class="badge badge-warning gap-2">STANDBY</div>
            
            <select id="persona-select" class="select select-bordered select-xs select-primary ml-2">
                <option value="Synthesizer">Synthesizer</option>
                <option value="Engineer">Software Engineer</option>
                <option value="Academic">Academic Researcher</option>
                <option value="Tutor">Socratic Tutor</option>
            </select>
            
            <!-- NEW QUALITY OF LIFE BUTTONS -->
            <button onclick="toggleTheme()" class="btn btn-xs btn-outline btn-warning ml-2" id="theme-toggle" title="Toggle Day/Night Mode">☀️</button>
            <button onclick="clearSession()" class="btn btn-xs btn-outline btn-error ml-2" title="Wipe Board & Start New Session">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>
            <button onclick="exportChat()" class="btn btn-xs btn-outline btn-info ml-2" title="Download Session Archive">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            </button>
        </div>
    </header>

    <main id="chat-window" class="flex-1 bg-base-100 rounded-box p-4 overflow-y-auto mb-4 space-y-4 shadow-xl scroll-smooth"></main>

    <footer class="flex gap-2 items-center">
        <input type="file" id="file-upload" accept="image/*,.pdf" class="hidden" onchange="previewFile()" />
        <button onclick="document.getElementById('file-upload').click()" class="btn btn-square btn-outline btn-primary" id="upload-btn" title="Upload PDF or Image">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
        </button>

        <button onclick="toggleVoiceDictation()" class="btn btn-square btn-outline btn-secondary" id="voice-btn" title="Toggle Voice Dictation">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="mic-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>

        <input type="text" id="cmd-input" placeholder="Enter query, upload data, or click microphone..." class="input input-bordered input-primary flex-1 focus:outline-none" />
        <button onclick="sendCommand()" class="btn btn-primary text-primary-content tracking-widest">EXECUTE</button>
    </footer>

    <script>
        let socket;
        let activeStreams = {};

        marked.setOptions({ breaks: true, gfm: true });
        
        document.addEventListener("DOMContentLoaded", () => {
            initializeSystem();
        });

        // DAY/NIGHT TOGGLE
        function toggleTheme() {
            const html = document.documentElement;
            const toggleBtn = document.getElementById('theme-toggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                toggleBtn.innerText = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                toggleBtn.innerText = '☀️';
            }
        }

        // WIPE BOARD LOGIC
        function clearSession() {
            socket.emit('clear_session');
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            
            // Post a tiny system notification
            const sysMsg = document.createElement('div');
            sysMsg.className = "text-center text-xs opacity-50 my-4 text-warning";
            sysMsg.innerText = "[ BOARD WIPED. MEMORY CLEARED. ]";
            chatWindow.appendChild(sysMsg);
        }

        // ONE-CLICK COPY LOGIC
        window.copyToClipboard = function(msgId, btnElement) {
            let textToCopy = "";
            if (activeStreams[msgId]) {
                textToCopy = activeStreams[msgId].rawText;
            }
            navigator.clipboard.writeText(textToCopy);
            const originalText = btnElement.innerText;
            btnElement.innerText = "COPIED!";
            setTimeout(() => { btnElement.innerText = originalText; }, 2000);
        }

        function exportChat() {
            const chatElements = document.querySelectorAll('.chat');
            if (chatElements.length === 0) return;
            let logText = "APEX // SECURE CHAT ARCHIVE\nGenerated: " + new Date().toLocaleString() + "\n=========================================\n\n";
            chatElements.forEach(chat => {
                const header = chat.querySelector('.chat-header').innerText.replace('COPY', '').replace('COPIED!', '').trim();
                const body = chat.querySelector('.chat-bubble').innerText;
                logText += `[${header}]\n${body}\n\n`;
            });
            const blob = new Blob([logText], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `APEX_Archive_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function initializeSystem() {
            socket = io();
            const chatWindow = document.getElementById('chat-window');
            const cmdInput = document.getElementById('cmd-input');
            const statusBadge = document.getElementById('status-badge');
            let isFirstConnect = true;

            socket.on('connect', () => {
                statusBadge.innerText = "ONLINE";
                statusBadge.classList.replace('badge-warning', 'badge-success');
                statusBadge.classList.replace('badge-error', 'badge-success');
                if (isFirstConnect) { 
                    const sysMsg = document.createElement('div');
                    sysMsg.className = "text-center text-xs opacity-50 my-4 text-success";
                    sysMsg.innerText = "[ SYSTEM ONLINE ] Public Gateway Open. Core Engine ready.";
                    chatWindow.appendChild(sysMsg);
                    isFirstConnect = false; 
                }
            });

            socket.on('disconnect', () => {
                statusBadge.innerText = "OFFLINE";
                statusBadge.classList.replace('badge-success', 'badge-error');
            });

            // Instant standard messages (Error alerts, Rate limit warnings)
            socket.on('ai_response', (data) => {
                const msgId = 'inst-' + Date.now();
                activeStreams[msgId] = { rawText: data.text };
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat chat-start`;
                const parsedText = marked.parse(data.text);
                
                msgDiv.innerHTML = `<div class="chat-header opacity-50 mb-1 flex justify-between w-full pr-8 relative">
                    <span>${data.sender}</span>
                    <button onclick="copyToClipboard('${msgId}', this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-xs opacity-50 hover:opacity-100 uppercase tracking-widest absolute right-0">COPY</button>
                </div>
                <div class="chat-bubble chat-bubble-primary shadow-md markdown-content" style="overflow-x: auto;">${parsedText}</div>`;
                
                chatWindow.appendChild(msgDiv);
                if (window.renderMathInElement) { renderMathInElement(msgDiv, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false }); }
                msgDiv.scrollIntoView({ behavior: "smooth", block: "start" });
            });

            // STREAMING PHASE 1: Create the empty bubble
            socket.on('ai_response_start', (data) => {
                activeStreams[data.msg_id] = { rawText: "" };
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat chat-start`;
                msgDiv.id = `msg-${data.msg_id}`;
                
                msgDiv.innerHTML = `<div class="chat-header opacity-50 mb-1 flex justify-between w-full pr-8 relative">
                    <span>${data.sender}</span>
                    <button onclick="copyToClipboard('${data.msg_id}', this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-xs opacity-50 hover:opacity-100 uppercase tracking-widest absolute right-0">COPY</button>
                </div>
                <div class="chat-bubble chat-bubble-primary shadow-md markdown-content" id="bubble-${data.msg_id}" style="overflow-x: auto;">
                    <span class="loading loading-dots loading-sm"></span>
                </div>`;
                
                chatWindow.appendChild(msgDiv);
                msgDiv.scrollIntoView({ behavior: "smooth", block: "start" });
            });

            // STREAMING PHASE 2: Typewriter text injection
            socket.on('ai_response_chunk', (data) => {
                if(activeStreams[data.msg_id]) {
                    activeStreams[data.msg_id].rawText += data.chunk;
                    const bubble = document.getElementById(`bubble-${data.msg_id}`);
                    if (bubble) {
                        bubble.innerHTML = marked.parse(activeStreams[data.msg_id].rawText);
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    }
                }
            });

            // STREAMING PHASE 3: Render Math formulas once text is done
            socket.on('ai_response_done', (data) => {
                if(activeStreams[data.msg_id]) {
                    const bubble = document.getElementById(`bubble-${data.msg_id}`);
                    if (bubble && window.renderMathInElement) {
                        renderMathInElement(bubble, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false });
                    }
                }
            });

            function appendUserMessage(text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat chat-end`;
                msgDiv.innerHTML = `<div class="chat-header opacity-50 mb-1">You</div><div class="chat-bubble chat-bubble-neutral shadow-md" style="overflow-x: auto;">${text.replace(/\n/g, '<br>')}</div>`;
                chatWindow.appendChild(msgDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            window.sendCommand = function() {
                const text = cmdInput.value.trim();
                if (!text && !window.currentFileData) return;
                
                const selectedPersona = document.getElementById('persona-select').value;
                
                let displayMsg = text || "[File Uploaded]";
                if (window.currentFileData && text) {
                    displayMsg += window.currentFileData.startsWith('data:application/pdf') ? " [📄 PDF Attached]" : " [📎 Image Attached]";
                }
                
                appendUserMessage(displayMsg);
                
                socket.emit('user_message', { 
                    command: text, 
                    file_data: window.currentFileData,
                    persona: selectedPersona
                });
                
                cmdInput.value = ''; window.currentFileData = null;
                document.getElementById('file-upload').value = '';
                document.getElementById('upload-btn').classList.replace('btn-active', 'btn-outline');
            }

            cmdInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") { e.preventDefault(); sendCommand(); }
            });
        }
        
        function previewFile() {
            const file = document.getElementById('file-upload').files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("File too large! Please keep uploads under 5MB to maintain server stability.");
                document.getElementById('file-upload').value = ''; 
                return;
            }
            const reader = new FileReader();
            reader.onload = e => { 
                window.currentFileData = e.target.result; 
                document.getElementById('upload-btn').classList.replace('btn-outline', 'btn-active'); 
            };
            reader.readAsDataURL(file);
        }

        let recognition = null; let isListening = false;
        if (window.SpeechRecognition || window.webkitSpeechRecognition) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
            recognition.onresult = (e) => {
                let finalTranscript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
                if (finalTranscript) document.getElementById('cmd-input').value += (document.getElementById('cmd-input').value ? ' ' : '') + finalTranscript;
            };
        }
        window.toggleVoiceDictation = function() {
            if (!recognition) return;
            const voiceBtn = document.getElementById('voice-btn');
            if (isListening) { isListening = false; recognition.stop(); voiceBtn.classList.replace('btn-active', 'btn-outline'); voiceBtn.classList.remove('animate-pulse'); }
            else { isListening = true; recognition.start(); voiceBtn.classList.replace('btn-outline', 'btn-active'); voiceBtn.classList.add('animate-pulse'); }
        }
    </script>
</body>
</html>
