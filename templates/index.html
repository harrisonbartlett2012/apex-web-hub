<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX // Cloud Gateway V3</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content pre { background-color: rgba(0,0,0,0.3); padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; }
        .markdown-content code { background-color: rgba(0,0,0,0.2); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: oklch(var(--p)); }
    </style>
</head>
<body class="bg-base-300 h-[100dvh] flex flex-col p-4 md:p-8 font-mono relative overflow-hidden transition-colors duration-300">

    <!-- HEADER -->
    <header class="flex justify-between items-center border-b border-primary/30 pb-4 mb-4">
        <div class="flex items-center gap-2">
            <span class="loading loading-ring loading-md text-primary"></span>
            <h1 class="text-2xl font-bold tracking-widest text-primary">APEX</h1>
            <span class="badge badge-outline badge-xs text-[10px] opacity-50 ml-1">USER: {{ username }}</span>
        </div>
        <div class="flex items-center gap-2">
            <div id="status-badge" class="badge badge-warning gap-2">STANDBY</div>
            
            <select id="persona-select" class="select select-bordered select-xs select-primary ml-2 hidden sm:inline-flex">
                <option value="Synthesizer">Synthesizer</option>
                <option value="Engineer">Software Engineer</option>
                <option value="Academic">Academic Researcher</option>
                <option value="Tutor">Socratic Tutor</option>
            </select>
            
            <button onclick="toggleTheme()" class="btn btn-xs btn-outline btn-warning ml-2" id="theme-toggle" title="Toggle Theme">☀️</button>
            <button onclick="document.getElementById('library-upload').click()" class="btn btn-xs btn-outline btn-accent ml-2" title="Upload to Permanent Library">📚 LIBRARY</button>
            <input type="file" id="library-upload" accept=".pdf" class="hidden" onchange="uploadToLibrary()" />
            <button onclick="clearSession()" class="btn btn-xs btn-outline btn-error ml-2" title="Wipe Board">WIPE</button>
            <a href="/logout" class="btn btn-xs btn-ghost text-error ml-2">LOGOUT</a>
        </div>
    </header>

    <!-- CHAT WINDOW -->
    <main id="chat-window" class="flex-1 bg-base-100 rounded-box p-4 overflow-y-auto mb-4 space-y-4 shadow-xl scroll-smooth">
        {% for msg in history %}
        <div class="chat {{ 'chat-end' if msg.role == 'user' else 'chat-start' }}">
            <div class="chat-header opacity-50 mb-1 flex justify-between w-full pr-8 relative">
                <span>{{ 'You' if msg.role == 'user' else 'APEX' }}</span>
                {% if msg.role == 'assistant' %}
                <div class="absolute right-0 flex gap-2">
                    <button onclick="exportToPDF(this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">🖨️ PDF</button>
                    <button onclick="copyOldMessage(this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">COPY</button>
                </div>
                {% endif %}
            </div>
            <div class="chat-bubble {{ 'chat-bubble-neutral' if msg.role == 'user' else 'chat-bubble-primary' }} shadow-md markdown-content" style="overflow-x: auto;">
                {{ msg.content | safe }}
            </div>
        </div>
        {% endfor %}
    </main>

    <!-- FOOTER INPUTS -->
    <footer class="flex gap-2 items-center relative">
        <div class="absolute bottom-[100%] left-0 pb-2 w-full flex flex-col items-start gap-2 pointer-events-none z-50">
            <!-- Slash Command Menu -->
            <div id="slash-menu" class="hidden pointer-events-auto bg-base-200 border border-primary/30 rounded-box shadow-xl w-64 flex-col overflow-hidden transition-all ml-16">
                <button onclick="useSlashCommand('/quiz ')" class="text-left px-4 py-2 hover:bg-primary/20 text-sm focus:outline-none"><span class="font-bold text-primary">/quiz</span> [topic]</button>
                <button onclick="useSlashCommand('/flashcards ')" class="text-left px-4 py-2 hover:bg-primary/20 text-sm border-t border-base-300 focus:outline-none"><span class="font-bold text-success">/flashcards</span> [topic]</button>
                <button onclick="useSlashCommand('/studyguide ')" class="text-left px-4 py-2 hover:bg-primary/20 text-sm border-t border-base-300 focus:outline-none"><span class="font-bold text-warning">/studyguide</span> [topic]</button>
                <button onclick="useSlashCommand('/search ')" class="text-left px-4 py-2 hover:bg-primary/20 text-sm border-t border-base-300 focus:outline-none"><span class="font-bold text-info">/search</span> [query]</button>
            </div>
            <!-- Attachment Preview -->
            <div id="attachment-preview" class="hidden pointer-events-auto bg-base-200 p-2 rounded-lg border border-primary/50 flex items-center gap-3 shadow-lg max-w-xs">
                <div class="flex-1 min-w-0"><p id="preview-name" class="text-xs font-bold truncate">file.pdf</p></div>
                <button onclick="clearAttachment()" class="btn btn-xs btn-circle btn-ghost text-error">✕</button>
            </div>
        </div>

        <input type="file" id="file-upload" accept="image/*,.pdf" class="hidden" onchange="previewFile()" />
        <button onclick="document.getElementById('file-upload').click()" class="btn btn-square btn-outline btn-primary z-10" id="upload-btn">📎</button>
        
        <input type="text" id="cmd-input" placeholder="Paste YouTube link, type '/' for cmds..." autocomplete="off" class="input input-bordered input-primary flex-1 focus:outline-none z-10" />
        <button onclick="sendCommand()" class="btn btn-primary tracking-widest z-10">EXECUTE</button>
    </footer>

    <script>
        let socket;
        let activeStreams = {};
        let lastSentCommand = "";
        let lastSentFile = null;

        marked.setOptions({ breaks: true, gfm: true });
        
        document.addEventListener("DOMContentLoaded", () => {
            socket = io();
            const chatWindow = document.getElementById('chat-window');
            const cmdInput = document.getElementById('cmd-input');
            const statusBadge = document.getElementById('status-badge');
            
            socket.on('connect', () => {
                statusBadge.innerText = "ONLINE";
                statusBadge.classList.replace('badge-warning', 'badge-success');
                statusBadge.classList.replace('badge-error', 'badge-success');
            });
            socket.on('disconnect', () => {
                statusBadge.innerText = "OFFLINE";
                statusBadge.classList.replace('badge-success', 'badge-error');
            });
            
            if (window.renderMathInElement) {
                document.querySelectorAll('.markdown-content').forEach(el => {
                    if (el.innerHTML.includes('#') || el.innerHTML.includes('*')) {
                        el.innerHTML = marked.parse(el.innerText);
                    }
                    renderMathInElement(el, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false });
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            cmdInput.addEventListener('input', (e) => {
                const menu = document.getElementById('slash-menu');
                e.target.value.startsWith('/') ? menu.classList.remove('hidden') : menu.classList.add('hidden');
            });

            socket.on('library_status', (data) => {
                const sysMsg = document.createElement('div');
                sysMsg.className = "text-center text-xs opacity-50 my-2 text-accent font-bold";
                sysMsg.innerText = `[ LIBRARY UPDATE ]: ${data.msg}`;
                chatWindow.appendChild(sysMsg);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });

            socket.on('ai_response', (data) => {
                const msgId = 'inst-' + Date.now();
                activeStreams[msgId] = { rawText: data.text };
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat chat-start`;
                msgDiv.innerHTML = `<div class="chat-header opacity-50 mb-1 flex justify-between w-full pr-8 relative">
                    <span>${data.sender}</span>
                    <div class="absolute right-0 flex gap-2">
                        <button onclick="exportToPDF(this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">🖨️ PDF</button>
                        <button onclick="copyToClipboard('${msgId}', this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">COPY</button>
                    </div>
                </div>
                <div class="chat-bubble chat-bubble-primary shadow-md markdown-content" style="overflow-x: auto;">${marked.parse(data.text)}</div>`;
                chatWindow.appendChild(msgDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });

            socket.on('ai_response_start', (data) => {
                activeStreams[data.msg_id] = { rawText: "" };
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat chat-start`;
                msgDiv.id = `msg-${data.msg_id}`;
                msgDiv.innerHTML = `<div class="chat-header opacity-50 mb-1 flex justify-between w-full pr-8 relative">
                    <span>${data.sender}</span>
                    <div class="absolute right-0 flex gap-2">
                        <button onclick="exportToPDF(this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">🖨️ PDF</button>
                        <button onclick="regenerateLast()" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">REGENERATE</button>
                        <button onclick="copyToClipboard('${data.msg_id}', this)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">COPY</button>
                    </div>
                </div>
                <div class="chat-bubble chat-bubble-primary shadow-md markdown-content" id="bubble-${data.msg_id}"><span class="loading loading-dots"></span></div>`;
                chatWindow.appendChild(msgDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });

            socket.on('ai_response_chunk', (data) => {
                if(activeStreams[data.msg_id]) {
                    activeStreams[data.msg_id].rawText += data.chunk;
                    document.getElementById(`bubble-${data.msg_id}`).innerHTML = marked.parse(activeStreams[data.msg_id].rawText);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }
            });

            socket.on('ai_response_done', (data) => {
                if(activeStreams[data.msg_id] && window.renderMathInElement) {
                    renderMathInElement(document.getElementById(`bubble-${data.msg_id}`), { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false });
                }
            });

            window.sendCommand = function() {
                const text = cmdInput.value.trim();
                if (!text && !window.currentFileData) return;
                
                let displayMsg = text || "[File Uploaded]";
                if (window.currentFileData && text) displayMsg += " [📎 File Attached]";
                
                lastSentCommand = text;
                lastSentFile = window.currentFileData;
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat chat-end`;
                msgDiv.innerHTML = `<div class="chat-header opacity-50 mb-1 flex gap-2 justify-end items-center">
                    <button onclick="editPrompt(\`${encodeURIComponent(text)}\`)" class="btn btn-xs btn-ghost p-1 h-auto min-h-0 text-[10px] opacity-50 hover:opacity-100 uppercase">EDIT</button>
                    <span>You</span>
                </div>
                <div class="chat-bubble chat-bubble-neutral shadow-md">${displayMsg}</div>`;
                chatWindow.appendChild(msgDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                
                socket.emit('user_message', { command: text, file_data: window.currentFileData, persona: document.getElementById('persona-select').value });
                cmdInput.value = ''; clearAttachment(); document.getElementById('slash-menu').classList.add('hidden');
            }

            cmdInput.addEventListener("keypress", (e) => { if (e.key === "Enter") { e.preventDefault(); sendCommand(); } });
        });

        window.exportToPDF = function(btnElement) {
            const bubble = btnElement.parentElement.parentElement.nextElementSibling;
            const content = bubble.innerHTML;
            const printWindow = window.open('', '', 'height=800,width=800');
            printWindow.document.write('<html><head><title>APEX Document Export</title>');
            printWindow.document.write('<link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />');
            printWindow.document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
            printWindow.document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">');
            printWindow.document.write('<style>body { padding: 40px; font-family: monospace; } h1, h2, h3 { color: #000 !important; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 20px;} .markdown-content pre { background: #f3f4f6; padding: 15px; color: #000; border-radius: 8px; border: 1px solid #e5e7eb; overflow-x: auto; margin-bottom: 15px;} .markdown-content code { background-color: #f3f4f6; padding: 2px 4px; border-radius: 4px; color: #eb4d4b; } @media print { body { padding: 0; } }</style>');
            printWindow.document.write('</head><body class="markdown-content bg-white text-black">');
            printWindow.document.write('<h1 class="text-3xl font-bold mb-6">APEX // Document Export</h1>');
            printWindow.document.write(content);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 1500);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const toggleBtn = document.getElementById('theme-toggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                toggleBtn.innerText = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                toggleBtn.innerText = '☀️';
            }
        }

        window.useSlashCommand = function(cmd) {
            document.getElementById('cmd-input').value = cmd;
            document.getElementById('cmd-input').focus();
            document.getElementById('slash-menu').classList.add('hidden');
        }

        window.copyToClipboard = function(msgId, btnElement) {
            let textToCopy = activeStreams[msgId] ? activeStreams[msgId].rawText : "";
            navigator.clipboard.writeText(textToCopy);
            const originalText = btnElement.innerText;
            btnElement.innerText = "COPIED!";
            setTimeout(() => { btnElement.innerText = originalText; }, 2000);
        }

        window.copyOldMessage = function(btnElement) {
            const bubble = btnElement.parentElement.parentElement.nextElementSibling;
            navigator.clipboard.writeText(bubble.innerText);
            const originalText = btnElement.innerText;
            btnElement.innerText = "COPIED!";
            setTimeout(() => { btnElement.innerText = originalText; }, 2000);
        }

        window.editPrompt = function(encodedText) {
            document.getElementById('cmd-input').value = decodeURIComponent(encodedText);
            document.getElementById('cmd-input').focus();
        }

        window.regenerateLast = function() {
            if (!lastSentCommand && !lastSentFile) return;
            const sysMsg = document.createElement('div');
            sysMsg.className = "text-center text-xs opacity-50 my-2 text-info";
            sysMsg.innerText = "[ REGENERATING PREVIOUS RESPONSE... ]";
            document.getElementById('chat-window').appendChild(sysMsg);
            socket.emit('user_message', { command: lastSentCommand, file_data: lastSentFile, persona: document.getElementById('persona-select').value });
        }

        function clearSession() {
            socket.emit('clear_session');
            document.getElementById('chat-window').innerHTML = '<div class="text-center text-xs opacity-50 my-4 text-warning">[ BOARD WIPED. MEMORY CLEARED. ]</div>';
            lastSentCommand = ""; lastSentFile = null;
        }

        function previewFile() {
            const file = document.getElementById('file-upload').files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) return alert("File too large! Max 5MB.");
            const reader = new FileReader();
            reader.onload = e => { 
                window.currentFileData = e.target.result; 
                document.getElementById('preview-name').innerText = file.name;
                document.getElementById('attachment-preview').classList.remove('hidden');
                document.getElementById('upload-btn').classList.replace('btn-outline', 'btn-active'); 
            };
            reader.readAsDataURL(file);
        }

        window.uploadToLibrary = function() {
            const file = document.getElementById('library-upload').files[0];
            if (!file || !file.type.includes('pdf')) return alert("Only PDFs are supported in the permanent library.");
            if (file.size > 15 * 1024 * 1024) return alert("Library PDFs must be under 15MB.");
            const reader = new FileReader();
            reader.onload = e => {
                const sysMsg = document.createElement('div');
                sysMsg.className = "text-center text-xs opacity-50 my-2 text-accent";
                sysMsg.innerHTML = `<span class="loading loading-spinner loading-xs"></span> [ INGESTING PDF TO LIBRARY... ]`;
                document.getElementById('chat-window').appendChild(sysMsg);
                socket.emit('upload_library', { filename: file.name, file_data: e.target.result });
            };
            reader.readAsDataURL(file);
        }

        window.clearAttachment = function() {
            window.currentFileData = null;
            document.getElementById('file-upload').value = '';
            document.getElementById('attachment-preview').classList.add('hidden');
            document.getElementById('upload-btn').classList.replace('btn-active', 'btn-outline');
        }
    </script>
</body>
</html>
