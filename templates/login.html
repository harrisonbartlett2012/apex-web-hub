<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX // Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-300 h-screen flex items-center justify-center font-mono p-4">

    <div class="card w-full max-w-sm bg-base-100 shadow-xl border border-primary/20">
        <div class="card-body">
            <h2 class="card-title text-primary justify-center tracking-widest mb-4">APEX // GATEWAY</h2>
            
            <div id="error-box" class="text-error text-xs text-center hidden mb-2 font-bold"></div>

            <div class="form-control">
                <label class="label"><span class="label-text">IDENTIFIER</span></label>
                <input type="text" id="username" class="input input-bordered input-primary bg-base-200" />
            </div>
            <div class="form-control mt-2">
                <label class="label"><span class="label-text">PASSPHRASE</span></label>
                <input type="password" id="password" class="input input-bordered input-primary bg-base-200" />
            </div>
            
            <div class="card-actions flex-col mt-6 gap-2">
                <button onclick="auth('login')" class="btn btn-primary w-full tracking-widest">INITIALIZE</button>
                <button onclick="auth('register')" class="btn btn-outline btn-secondary w-full text-xs">CREATE ACCOUNT</button>
            </div>
        </div>
    </div>

    <script>
        async function auth(action) {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('error-box');
            
            if (!u || !p) { err.innerText = "Credentials required."; err.classList.remove('hidden'); return; }

            const res = await fetch(`/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();

            if (data.success) {
                window.location.href = '/';
            } else {
                err.innerText = data.error;
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
